name: Verify Lite
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build reproducible archive
        run: |
          python scripts/build.py dist/access-assurance-lite.pyz
          python scripts/build.py dist/repeated.pyz
          cmp dist/access-assurance-lite.pyz dist/repeated.pyz
      - name: Run packaged demonstration
        run: |
          python dist/access-assurance-lite.pyz doctor --json
          python dist/access-assurance-lite.pyz demo --directory "$RUNNER_TEMP/assurance-demo" --json
          python dist/access-assurance-lite.pyz benchmark --json
